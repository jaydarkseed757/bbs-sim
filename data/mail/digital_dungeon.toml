subject = "Ultima Underworld 2 -- stuck on Killorn Keep"
timestamp = "04/08/93 22:40"
body = """
I know you posted about finishing UU2 a while back. Needed to ask for help.

I'm completely stuck on the Killorn Keep world. The key to the upper
barracks is nowhere I can find. I've talked to every guard and nothing.

Also the lava room puzzle -- am I missing something obvious? Feels like
there should be a lever somewhere.

Any hints without full spoilers would be appreciated.
-- LoreDigger"""

[[messages]]
id = 5
from = "CrawlMaster"
subject = "System Shock -- have you seen the preview?"
timestamp = "04/12/93 14:00"
body = """
Looking Glass is showing off System Shock at some industry events.
It's essentially Ultima Underworld in a cyberpunk space station.

Full 3D environment, real physics, hacking minigames, AI enemy behavior.
The interface is mouse-driven which sounds weird for a first-person game
but apparently it works beautifully once you get used to it.

This is the successor to UU that I didn't know I needed.
Come post in the RPG board -- I started a thread.
-- CrawlMaster"""
