body = """
Quick reminder -- 2600 meeting is this Friday at the World Trade Center.
First Friday as always. Show up around 5pm, Citibank lobby atrium.

Security has been tighter since the February bombing but they've been
leaving us alone. Bring ID just in case.

About 40 people usually show. Good mix. Come find me -- I'll be the one
with the PowerBook and a very long phone cord.

-- Pr0phet"""
