[[boards.threads]]
id = 3
subject = "Fansub scene -- what's getting passed around?"

[[boards.threads.posts]]
id = 1
author = "AnimeExport"
subject = "Fansub scene -- what's getting passed around?"
timestamp = "04/01/93 20:00"
body = """
The fansub scene is exploding. Groups are subtitling new series faster than ever.
Currently circulating: Tenchi Muyo OVAs, Ranma 1/2 season 3, Slayers preview.
Tape quality varies enormously -- some groups are doing proper typesetting now.
The best fansubs are actually better translated than some official dubs. No question."""

[[boards.threads.posts]]
id = 2
author = "MangaFan88"
subject = "Re: Fansub scene -- what's getting passed around?"
timestamp = "04/02/93 10:30"
body = """
Project A-Ko and Bubblegum Crisis are the gateway drugs. Get them on anyone you're converting.
The Tenchi Muyo OVAs are gorgeous -- Pioneer's animation budget is obvious.
The tape trading network is the internet before the internet.
Send a blank tape with return postage and you get something back. It just works."""

[[boards.threads.posts]]
id = 3
author = "CyberGhost"
subject = "Re: Fansub scene -- what's getting passed around?"
timestamp = "04/03/93 02:00"
body = """
Neon Genesis Evangelion is apparently in production at Gainax. Rumor only.
If Anno is directing it's going to be something. GAINAX doesn't do safe.
Gunbuster is still the benchmark for mecha pacing and emotional payoff.
The fansub of Gunbuster has been copied so many times the 10th-gen tapes are artifacts."""

[[boards.threads]]
id = 4
subject = "Sailor Moon -- worth tracking down?"

[[boards.threads.posts]]
id = 1
author = "MangaFan88"
subject = "Sailor Moon -- worth tracking down?"
timestamp = "05/15/93 19:00"
body = """
Sailor Moon has been running in Japan since '92. The DiC dub deal was just announced.
The manga by Takeuchi Naoko is excellent -- better than the anime in some ways.
Nausicaa-quality art at its best. The senshi designs are genuinely iconic.
Fansubs are coming if anyone wants the Japanese version while waiting for the dub."""

[[boards.threads.posts]]
id = 2
author = "KirkFan"
subject = "Re: Sailor Moon -- worth tracking down?"
timestamp = "05/16/93 10:00"
body = """
Watched the first episode of the fansub. Not what I expected from the synopsis.
The transformation sequences are clearly aimed at kids but the monster-of-the-week structure works.
Usagi is annoying in the best possible way. The supporting senshi are more interesting.
The outer senshi that supposedly appear later are apparently where it gets good."""

[[boards.threads.posts]]
id = 3
author = "AnimeExport"
subject = "Re: Sailor Moon -- worth tracking down?"
timestamp = "05/17/93 22:00"
body = """
The R season is where it finds its voice. The first season is setup.
The Mamoru/Usagi dynamic improves dramatically once the amnesia arc pays off.
The Japanese voice acting for Usagi is specifically calibrated as deliberately annoying.
If the DiC dub softens her too much they'll lose what makes the character work."""
