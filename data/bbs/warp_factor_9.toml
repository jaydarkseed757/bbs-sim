subject = "DS9 premiere -- best Trek since TOS?"

[[boards.threads.posts]]
id = 1
author = "KirkFan"
subject = "DS9 premiere -- best Trek since TOS?"
timestamp = "01/04/93 22:00"
body = """
Deep Space Nine premiered last night. Blown away.
A stationary setting felt risky but it totally works.
Sisko is immediately more interesting than I expected.
The Cardassian occupation backstory gives it real weight."""

[[boards.threads.posts]]
id = 2
author = "Tribble99"
subject = "Re: DS9 premiere -- best Trek since TOS?"
timestamp = "01/05/93 08:30"
body = """
Hard disagree on Sisko but I think DS9 has serious potential.
The Bajoran religion angle is bold for Trek -- usually they avoid that stuff.
Odo is already my favorite character. Rene Auberjonois is perfect."""

[[boards.threads.posts]]
id = 3
author = "WarpCore"
subject = "Re: DS9 premiere -- best Trek since TOS?"
timestamp = "01/05/93 19:45"
body = """
TNG is still king for me but DS9 is off to a strong start.
The darker tone feels right for a post-Cardassian occupied station.
Also that runabout design is slick -- hope we see a lot of it."""

[[boards.threads]]
id = 2
subject = "Babylon 5 pilot -- worth watching?"

[[boards.threads.posts]]
id = 1
author = "SciFiJunky"
subject = "Babylon 5 pilot -- worth watching?"
timestamp = "02/23/93 20:15"
body = """
The Gathering aired last month. Straczynski wrote the whole thing himself.
CGI effects instead of models -- controversial but I think it works.
Feels very different from Trek. More political, more grey-area morality."""

[[boards.threads.posts]]
id = 2
author = "KirkFan"
subject = "Re: Babylon 5 pilot -- worth watching?"
timestamp = "02/24/93 10:00"
body = """
Watched it last week. The CGI is rough but the story is solid.
Londo and G'Kar are immediately the most interesting alien characters
I've seen since Spock. The politics between the races feels real.
If they get a series pickup this could be something special."""

[[boards.threads.posts]]
id = 3
author = "NightOwl_TX"
subject = "Re: Babylon 5 pilot -- worth watching?"
timestamp = "02/25/93 03:22"
body = """
Straczynski has apparently already written out the entire 5-year arc.
That kind of long-form planning is unheard of in TV sci-fi.
Either it'll be brilliant or crash hard. My money is on brilliant."""

[[boards.threads]]
id = 3
subject = "Jurassic Park -- read the book?"

[[boards.threads.posts]]
id = 1
author = "DinoFreak"
subject = "Jurassic Park -- read the book?"
timestamp = "04/10/93 16:00"
body = """
Movie drops in June. If you haven't read Crichton's novel yet DO IT NOW.
The science is surprisingly solid -- Crichton actually researched this.
The chaos theory stuff with Dr. Malcolm is mind-bending.
Movie is going to be insane based on the trailer."""

[[boards.threads.posts]]
id = 2
author = "WarpCore"
subject = "Re: Jurassic Park -- read the book?"
timestamp = "04/11/93 12:30"
body = """
Read it twice. The book is darker than what the trailer suggests.
The kids are in way more danger, and the dinosaur attacks are brutal.
Spielberg will soften it for the rating but the CGI looks photorealistic.
That T-Rex in the rain from the trailer is going to be iconic."""

