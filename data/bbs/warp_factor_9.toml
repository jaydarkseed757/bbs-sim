subject = "Ghost in the Shell manga -- reading it?"
timestamp = "03/20/93 17:30"
body = """
Masamune Shirow's Ghost in the Shell is available in English now from Dark Horse.
The philosophical depth about identity and consciousness is real literature.
Heard a film adaptation is in the works at Production I.G.
If it's half as good as the manga it'll be incredible."""

[[boards.threads.posts]]
id = 2
author = "MangaFan88"
subject = "Re: Ghost in the Shell manga -- reading it?"
timestamp = "03/21/93 22:00"
body = """
On my second read. The footnotes alone are worth the price.
Shirow explains the tech in detail -- the cyborg augmentation economics are fascinating.
The Major is such a well-written character. Complex in ways most fiction isn't."""
