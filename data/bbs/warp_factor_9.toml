[[boards.threads]]
id = 1
subject = "Ultima VII -- greatest RPG ever made?"

[[boards.threads.posts]]
id = 1
author = "AvatarSeeker"
subject = "Ultima VII -- greatest RPG ever made?"
timestamp = "03/01/93 14:00"
body = """
Finally finished Ultima VII: The Black Gate. What an experience.
The world simulation is unlike anything I've played. NPCs have schedules.
You can bake bread. The Fellowship storyline is genuinely unsettling.
Richard Garriott deserves some kind of award for this one."""

[[boards.threads.posts]]
id = 2
author = "QuestMaster"
subject = "Re: Ultima VII -- greatest RPG ever made?"
timestamp = "03/02/93 09:15"
body = """
100% agree. The Serpent Isle expansion is also incredible.
The depth of the world simulation embarrasses everything else on the market.
Only gripe: needs a 486 with 4MB RAM minimum to run well.
My 386/33 chugs on some of the outdoor areas."""

[[boards.threads.posts]]
id = 3
author = "PixelQuest"
subject = "Re: Ultima VII -- greatest RPG ever made?"
timestamp = "03/03/93 22:50"
body = """
Hard to argue against it. Wizardry 7 is also up there for me.
The stat tracking and multi-race party system in Wiz7 is deep.
But Ultima VII wins for world immersion. Nothing else comes close in '93."""

