subject = "Akira -- how did you first see it?"

[[boards.threads.posts]]
id = 1
author = "KirkFan"
subject = "Akira -- how did you first see it?"
timestamp = "02/14/93 20:00"
body = """
Started a thread because I think Akira is the most important animated film ever made.
Caught it on a VHS dub from a friend two years ago and it changed my brain.
The crowd who wrote it off as "just a cartoon" genuinely don't get it.
How did everyone else first encounter it?"""

[[boards.threads.posts]]
id = 2
author = "MangaFan88"
subject = "Re: Akira -- how did you first see it?"
timestamp = "02/15/93 14:20"
body = """
Friend had the Streamline dub on tape. Watched it at like 2am.
The Neo-Tokyo animation quality is still unmatched in '93.
I tracked down the Kodansha manga after -- the full story is even deeper.
6 volumes and the ending is completely different from the film."""

[[boards.threads.posts]]
id = 3
author = "AnimeExport"
subject = "Re: Akira -- how did you first see it?"
timestamp = "02/16/93 10:00"
body = """
Import VHS from Japan before it got licensed here. Worth every penny.
The cel count on the motorcycle chase alone is insane -- hand-drawn fluidity.
If you can find the Pioneer LaserDisc release the image quality is stunning."""

