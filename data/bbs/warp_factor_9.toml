subject = "Akira -- how did you first see it?"

[[boards.threads.posts]]
id = 1
author = "KirkFan"
subject = "Akira -- how did you first see it?"
timestamp = "02/14/93 20:00"
body = """
Started a thread because I think Akira is the most important animated film ever made.
Caught it on a VHS dub from a friend two years ago and it changed my brain.
The crowd who wrote it off as "just a cartoon" genuinely don't get it.
How did everyone else first encounter it?"""

[[boards.threads.posts]]
id = 2
author = "MangaFan88"
subject = "Re: Akira -- how did you first see it?"
timestamp = "02/15/93 14:20"
body = """
Friend had the Streamline dub on tape. Watched it at like 2am.
The Neo-Tokyo animation quality is still unmatched in '93.
I tracked down the Kodansha manga after -- the full story is even deeper.
6 volumes and the ending is completely different from the film."""

[[boards.threads.posts]]
id = 3
author = "AnimeExport"
subject = "Re: Akira -- how did you first see it?"
timestamp = "02/16/93 10:00"
body = """
Import VHS from Japan before it got licensed here. Worth every penny.
The cel count on the motorcycle chase alone is insane -- hand-drawn fluidity.
If you can find the Pioneer LaserDisc release the image quality is stunning."""

[[boards.threads]]
id = 2
subject = "Ghost in the Shell manga -- reading it?"

[[boards.threads.posts]]
id = 1
author = "CyberGhost"
subject = "Ghost in the Shell manga -- reading it?"
timestamp = "03/20/93 17:30"
body = """
Masamune Shirow's Ghost in the Shell is available in English now from Dark Horse.
The philosophical depth about identity and consciousness is real literature.
Heard a film adaptation is in the works at Production I.G.
If it's half as good as the manga it'll be incredible."""

[[boards.threads.posts]]
id = 2
author = "MangaFan88"
subject = "Re: Ghost in the Shell manga -- reading it?"
timestamp = "03/21/93 22:00"
body = """
On my second read. The footnotes alone are worth the price.
Shirow explains the tech in detail -- the cyborg augmentation economics are fascinating.
The Major is such a well-written character. Complex in ways most fiction isn't."""

[[boards.threads]]
id = 4
subject = "X-Files pilot -- new show to watch?"

[[boards.threads.posts]]
id = 1
author = "NightOwl_TX"
subject = "X-Files pilot -- new show to watch?"
timestamp = "09/12/93 01:00"
body = """
X-Files premiered Friday on Fox. Nobody seems to know about it yet.
FBI agents investigating paranormal cases. Mulder and Scully are the duo.
The pilot is doing Silence of the Lambs atmosphere on a TV budget.
Something about the Pacific Northwest setting + government conspiracy angle hits right."""

[[boards.threads.posts]]
id = 2
author = "SciFiJunky"
subject = "Re: X-Files pilot -- new show to watch?"
timestamp = "09/12/93 14:30"
body = """
Watched it live. Fox buried it on a Friday which is a death slot but it's too good to die.
The monster-of-the-week format with a running mythology arc is smart TV design.
Mulder believing everything and Scully believing nothing creates built-in tension.
The music from Mark Snow is great. Not quite Herrmann but eerie in the right way."""

[[boards.threads.posts]]
id = 3
author = "WarpCore"
subject = "Re: X-Files pilot -- new show to watch?"
timestamp = "09/13/93 10:00"
body = """
The government conspiracy angle is the long game. Pilot plants seeds carefully.
The alien-abduction story connects personal tragedy to the larger mythology.
Gillian Anderson is doing something interesting with Scully -- skepticism without smugness.
This is the show I didn't know I wanted. Record every episode."""

[[boards.threads.posts]]
id = 4
author = "KirkFan"
subject = "Re: X-Files pilot -- new show to watch?"
timestamp = "09/14/93 22:00"
body = """
Set my VCR. If this gets cancelled I'm writing angry letters.
The government-knows-about-aliens premise is well-worn but the execution is fresh.
The paranoia feels timely after everything this year. Waco, WTC, the whole thing.
"The truth is out there" as a thesis statement for 1993 America. Unironic."""

[[boards.threads]]
id = 5
subject = "Babylon 5 -- series officially confirmed"

[[boards.threads.posts]]
id = 1
author = "SciFiJunky"
subject = "Babylon 5 -- series officially confirmed"
timestamp = "05/20/93 20:00"
body = """
PTEN picked up Babylon 5 for a full 22-episode season. Fall 1993.
Straczynski says he already has the 5-year arc written. All of it.
If he actually pulls that off it'll be the most ambitious SF television ever attempted.
The pilot CGI was rough. The series reportedly has more budget for the effects."""

[[boards.threads.posts]]
id = 2
author = "WarpCore"
subject = "Re: Babylon 5 -- series officially confirmed"
timestamp = "05/21/93 10:00"
body = """
The Londo and G'Kar dynamic is the show. Everything else is scaffolding.
Two characters who are mirror images -- one declining empire, one rising cause.
Straczynski really thought through the alien politics as actual alien politics.
Not rubber-forehead humans. Actual different values and worldviews."""

[[boards.threads.posts]]
id = 3
author = "Tribble99"
subject = "Re: Babylon 5 -- series officially confirmed"
timestamp = "05/22/93 18:30"
body = """
DS9 and B5 both doing the stationary-station premise in the same season.
The DS9 camp says B5 copied them. The B5 camp says the opposite.
Both shows look like they're going to be good, which should be the conversation.
I'll watch both. The nerd wars about which one "came first" are pointless."""

# ── Gaming additions ─────────────────────────────────────────────────────────────

[[boards.threads]]
id = 3
subject = "Star Wars: X-Wing -- finally a proper space sim"

[[boards.threads.posts]]
id = 1
author = "StarPilot"
subject = "Star Wars: X-Wing -- finally a proper space sim"
timestamp = "02/10/93 22:00"
body = """
X-Wing from LucasArts is the game I've been waiting for since 1977.
Proper 3D space combat from the cockpit of an X-Wing or Y-Wing or A-Wing.
The campaign tracks the Rebellion timeline including a full Death Star mission.
The targeting computer, the wingmen, the briefings -- this is Star Wars as simulation."""

[[boards.threads.posts]]
id = 2
author = "AvatarSeeker"
subject = "Re: Star Wars: X-Wing -- finally a proper space sim"
timestamp = "02/11/93 10:30"
body = """
The Tour of Duty system with persistent wingmen who can die is brilliant.
Lost Rookie One on the third mission. Took it personally.
The mission design rewards knowing the Star Wars universe -- the Easter eggs are everywhere.
The difficulty on Hard is genuinely hard. The Empire AI in TIE fighters is aggressive."""

[[boards.threads.posts]]
id = 3
author = "PixelQuest"
subject = "Re: Star Wars: X-Wing -- finally a proper space sim"
timestamp = "02/12/93 18:00"
body = """
Running it on my 486/33 with a joystick. The joystick is essential.
Keyboard control works but the analog stick for fine aim in a dogfight is the difference.
The Thrustmaster FCS is the gold standard. Worth the $80.
The B-Wing missions with the heavy laser cannons are the most satisfying combat in the game."""

[[boards.threads.posts]]
id = 4
author = "QuestMaster"
subject = "Re: Star Wars: X-Wing -- finally a proper space sim"
timestamp = "02/14/93 01:30"
body = """
The mission editor for creating custom missions is the long tail.
Already downloaded a dozen user missions from various boards. Quality varies wildly.
The best ones understand how the game's systems create drama. 
A well-designed ambush scenario is genuinely tense. The tool is powerful in the right hands."""

[[boards.threads]]
id = 4
subject = "Sam and Max Hit the Road -- LucasArts is on a roll"

[[boards.threads.posts]]
id = 1
author = "QuestMaster"
subject = "Sam and Max Hit the Road -- LucasArts is on a roll"
timestamp = "11/10/93 20:00"
body = """
Sam and Max dropped and it might be funnier than Day of the Tentacle.
MIGHT be. The Freelance Police are perfect video game protagonists.
The roadside America setting is inspired -- every location is its own absurdist joke.
The mafia dinosaurs subplot is the best thing in adventure games this year."""

[[boards.threads.posts]]
id = 2
author = "PixelQuest"
subject = "Re: Sam and Max Hit the Road -- LucasArts is on a roll"
timestamp = "11/11/93 10:00"
body = """
The voice acting is what puts it over the top. The actors get it completely.
Max especially -- the delivery on his non-sequiturs is perfectly deadpan.
LucasArts has put out Day of the Tentacle and this in the same year.
No other game company has this hit rate. Not even close."""

[[boards.threads.posts]]
id = 3
author = "AvatarSeeker"
subject = "Re: Sam and Max Hit the Road -- LucasArts is on a roll"
timestamp = "11/12/93 22:30"
body = """
The inventory interactions are funnier than the puzzle solutions.
Try using everything on everything just to hear the dialogue.
The bigfoot mythology subplot ties together in a way you don't expect until it does.
Steve Purcell's comic sensibility translates perfectly. This medium needs more of this."""

