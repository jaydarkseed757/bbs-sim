author = "ChipWizard"
subject = "Re: Depeche Mode Songs of Faith and Devotion -- take"
timestamp = "04/02/93 09:00"
body = """
I hear what they're going for with the live instruments but I miss the cold electronics.
Violator was near-perfect. SoFaD is warmer and less precise.
In Your Room is the closest to classic Mode and it's stunning.
Dave Gahan's voice sounds like a man in genuine crisis. Which he reportedly is."""

[[boards.threads.posts]]
id = 3
author = "ModMaster"
subject = "Re: Depeche Mode Songs of Faith and Devotion -- take"
timestamp = "04/03/93 02:30"
body = """
The production is Flood and Wilder again. The drum sounds alone cost more than my rig.
Condemnation is the one that got me. Gospel choir on a Depeche Mode album works somehow.
This is their heaviest record emotionally. The pressure of making it is audible.
Hold on to whatever you can: possibly a genius record, possibly a band dissolving."""

[[boards.threads]]
id = 4
subject = "Smashing Pumpkins Siamese Dream"

[[boards.threads.posts]]
id = 1
author = "SoundHack"
subject = "Smashing Pumpkins Siamese Dream"
timestamp = "07/27/93 20:00"
body = """
Siamese Dream just dropped. Corgan wrote almost everything himself during a breakdown.
The guitar layering is absurd -- allegedly hundreds of tracks on Cherub Rock alone.
Butch Vig's production (same producer as Nevermind) is immaculate.
Disarm is a different beast from everything else on the record. Quietly devastating."""

[[boards.threads.posts]]
id = 2
author = "AudioFreak"
subject = "Re: Smashing Pumpkins Siamese Dream"
timestamp = "07/28/93 11:30"
body = """
Hummer is the song. Eight minutes of feedback and melody and it all makes sense.
The Gish comparisons are unfair -- this is a completely different scale of ambition.
Corgan reportedly played almost every instrument himself because he didn't trust the band.
The neurotic perfectionism is all over the record and that's why it's great."""

[[boards.threads.posts]]
id = 3
author = "31337"
subject = "Re: Smashing Pumpkins Siamese Dream"
timestamp = "07/29/93 03:15"
body = """
From a production standpoint this is the best-sounding rock record of the year.
Vig gets more dynamic range than anyone working in major label rock right now.
The bass on Today is huge. The guitar on Soma is huge. Everything is huge.
Nirvana, Soundgarden, now this. 1993 is a year for loud guitar records."""
