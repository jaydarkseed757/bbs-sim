[[boards.threads]]
id = 1
subject = "Mosaic browser -- the internet just got real"

[[boards.threads.posts]]
id = 1
author = "NetSurfer"
subject = "Mosaic browser -- the internet just got real"
timestamp = "03/15/93 20:00"
body = """
NCSA Mosaic 1.0 just released for X Windows, PC version soon.
Point-and-click internet navigation with inline images. This changes everything.
I've been on gopher and FTP for years but this is a different paradigm.
The web is going to be enormous. Get on it now before the normies find it."""

[[boards.threads.posts]]
id = 2
author = "31337"
subject = "Re: Mosaic browser -- the internet just got real"
timestamp = "03/16/93 08:30"
body = """
Running it on our university's Unix systems. The image rendering is impressive.
Slow over dial-up but inline images in a document is genuinely revolutionary.
Tim Berners-Lee's HTTP spec is elegant. Hyperlinks are the right model.
Gopher is dead and doesn't know it yet."""

[[boards.threads.posts]]
id = 3
author = "PacketMonger"
subject = "Re: Mosaic browser -- the internet just got real"
timestamp = "03/17/93 11:45"
body = """
The protocol stack is simple enough to implement yourself.
HTTP GET request, parse HTML, done. Beautiful in its simplicity.
I wrote a basic HTTP fetcher in C over a weekend -- about 300 lines.
When the Windows version drops this is going to explode in popularity."""

[[boards.threads]]
id = 2
subject = "2600 Magazine -- best issues?"

[[boards.threads.posts]]
id = 1
author = "Phreaker_X"
subject = "2600 Magazine -- best issues?"
timestamp = "02/01/93 19:00"
body = """
Been collecting 2600 since the early issues. What are people's favorites?
The summer '92 issue with the cellular phone analysis was outstanding.
Emmanuel Goldstein keeps the editorial quality sharp year after year.
The phone company technical articles are worth the subscription alone."""

[[boards.threads.posts]]
id = 2
author = "31337"
subject = "Re: 2600 Magazine -- best issues?"
timestamp = "02/02/93 10:20"
body = """
The spring '91 issue is a classic -- the PBX systems article is legendary.
Also the ongoing Unix security series has been invaluable.
Goldstein's editorials on the hacker ethic are the best writing in tech.
The Kevin Mitnick coverage has been fascinating to follow."""

[[boards.threads.posts]]
id = 3
author = "NetSurfer"
subject = "Re: 2600 Magazine -- best issues?"
timestamp = "02/03/93 22:15"
body = """
The ARPANET history article in '90 was what got me serious about networking.
Also the video game security breakdowns are surprisingly deep technically.
There's a 2600 meeting in NYC every first Friday -- anyone ever gone?
The local chapters are where the real knowledge sharing happens."""

