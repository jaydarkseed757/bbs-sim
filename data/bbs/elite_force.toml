Songs of Faith and Devotion dropped Monday. Already on my third listen.
Live drums on a Depeche Mode album. Real guitar. It sounds massive.
Walking in My Shoes might be the best song they've ever written. Bold claim, I know.
The Devotional tour is apparently going to be enormous."""

[[boards.threads.posts]]
