[[boards.threads]]
id = 3
subject = "PGP 2.3 -- everyone needs to be using this now"

[[boards.threads.posts]]
id = 1
author = "PacketMonger"
subject = "PGP 2.3 -- everyone needs to be using this now"
timestamp = "03/05/93 22:00"
body = """
PGP 2.3 is out. Phil Zimmermann's public key encryption for the masses.
RSA encryption strong enough that no government can crack it without your key.
The legal situation is murky -- RSA Inc. claims patent infringement.
Ignore that and use it anyway. Privacy is not a crime."""

[[boards.threads.posts]]
id = 2
author = "NetSurfer"
subject = "Re: PGP 2.3 -- everyone needs to be using this now"
timestamp = "03/06/93 09:15"
body = """
Key servers are up and running. pub ring is growing every week.
The web of trust model is the right approach for decentralized authentication.
Sign each other's keys. Attend key signing parties. The network effect matters.
If you communicate anything sensitive: PGP. No excuses in 1993."""

[[boards.threads.posts]]
id = 3
author = "Phreaker_X"
subject = "Re: PGP 2.3 -- everyone needs to be using this now"
timestamp = "03/07/93 15:30"
body = """
The export control situation is the real concern. Zimmermann is under federal scrutiny.
Cryptography as a weapon: the State Department's position. Absurd but legally real.
The crypto wars are going to be a defining fight of this decade.
Use it, distribute it, make it ubiquitous. Too widely used to suppress."""

[[boards.threads.posts]]
id = 4
author = "CyberLiberty"
subject = "Re: PGP 2.3 -- everyone needs to be using this now"
timestamp = "03/08/93 01:00"
body = """
The Clipper chip proposal is the government's counter-move. Watch for it.
Mandatory key escrow so law enforcement can always decrypt. The Orwell move.
If Clipper passes, encryption without backdoors becomes politically untenable.
PGP being widely deployed before Clipper solidifies is exactly the right timing."""

[[boards.threads]]
id = 4
subject = "Gopher vs WWW -- which wins?"

[[boards.threads.posts]]
id = 1
author = "31337"
subject = "Gopher vs WWW -- which wins?"
timestamp = "04/20/93 19:00"
body = """
Gopher has more content right now. Clean hierarchy, fast, text-focused.
The WWW is slower, messier, but supports images and links in any direction.
Pragmatically: Gopher is better for finding things. Web is better for presenting things.
Long term? I think the web wins. The hyperlink is too powerful to lose."""

[[boards.threads.posts]]
id = 2
author = "PacketMonger"
subject = "Re: Gopher vs WWW -- which wins?"
timestamp = "04/21/93 10:00"
body = """
Gopher adoption at universities is massive right now. It's the working internet.
The web has no search infrastructure yet. How do you find anything?
Mosaic changes the equation but the content has to follow the browser.
Give it two years. The web site count is doubling every few months."""

[[boards.threads.posts]]
id = 3
author = "NetSurfer"
subject = "Re: Gopher vs WWW -- which wins?"
timestamp = "04/22/93 23:30"
body = """
I've been watching the HTML spec evolve. It's going to get more powerful fast.
Images are already in, forms are coming, scripting will follow.
Gopher is a read-only medium. The web is read-write by design.
The network effect: once businesses find the web, Gopher is dead in five years."""

