[[boards.threads]]
id = 1
subject = "Scream Tracker 3 -- best tracker out there?"

[[boards.threads.posts]]
id = 1
author = "ModMaster"
subject = "Scream Tracker 3 -- best tracker out there?"
timestamp = "03/10/93 21:00"
body = """
Scream Tracker 3 dropped and it's a serious upgrade from ST2.
16 channels, stereo panning, full S3M format support. The interface is intuitive.
Been making mods for two years and this is the best tool I've used.
Anyone else switching from ProTracker or FastTracker?"""

[[boards.threads.posts]]
id = 2
author = "ChipWizard"
subject = "Re: Scream Tracker 3 -- best tracker out there?"
timestamp = "03/11/93 14:00"
body = """
FastTracker II is still my main tool but ST3 has better sample handling.
The S3M format files are slightly larger than XM but the player support is better.
Impulse Tracker is supposedly in development -- rumored to be even more capable.
The demoscene S3M releases have been incredible quality lately."""

[[boards.threads.posts]]
id = 3
author = "SoundHack"
subject = "Re: Scream Tracker 3 -- best tracker out there?"
timestamp = "03/12/93 10:30"
body = """
Been on FastTracker since 1.0 but ST3 is converting me.
The envelope editor is more flexible for complex instrument design.
If you're on Sound Blaster 16 the stereo output is crystal clear.
Post your best S3M to the board -- I want to hear what people are making."""

[[boards.threads]]
id = 2
subject = "Grunge is dead -- discuss"

[[boards.threads.posts]]
id = 1
author = "31337"
subject = "Grunge is dead -- discuss"
timestamp = "04/08/93 18:00"
body = """
Nirvana's on the charts, Pearl Jam is selling out arenas, Alice in Chains everywhere.
The moment mainstream radio found grunge it became something else entirely.
The authentic Seattle scene from '89-'91 is already gone.
Change my mind."""

[[boards.threads.posts]]
id = 2
author = "AudioFreak"
subject = "Re: Grunge is dead -- discuss"
timestamp = "04/09/93 09:45"
body = """
Hot take but I think In Utero is better than Nevermind.
Albini's production is rawer and angrier which is how Nirvana should sound.
If Cobain can resist the commercial pressure there might be life in this yet.
The sellout accusations are getting tired -- the music still matters."""

[[boards.threads.posts]]
id = 3
author = "ModMaster"
subject = "Re: Grunge is dead -- discuss"
timestamp = "04/10/93 01:15"
body = """
Purely from a production standpoint In Utero is a masterpiece.
The guitar tones Albini got are unlike anything on a major label record.
Grunge as a cultural moment: probably over. The music itself: still has legs.
Meanwhile the underground is already moving to post-rock and noise pop."""
