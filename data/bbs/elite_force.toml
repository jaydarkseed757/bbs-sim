[[boards.threads]]
id = 3
subject = "Myst -- puzzle game or interactive movie?"

[[boards.threads.posts]]
id = 1
author = "ByteRunner"
subject = "Myst -- puzzle game or interactive movie?"
timestamp = "09/24/93 20:00"
body = """
Myst shipped. CD-ROM required, 4MB RAM minimum. The screenshots are stunning.
Pre-rendered 3D environments with puzzle elements. No inventory, no enemies.
The gaming press doesn't know what category to put it in.
I have a feeling this thing is going to sell to people who don't play games at all."""

[[boards.threads.posts]]
id = 2
author = "CrackSmith"
subject = "Re: Myst -- puzzle game or interactive movie?"
timestamp = "09/25/93 11:00"
body = """
Played it for six hours last night. The puzzle design respects your intelligence.
No pixel hunting, no arbitrary death -- you observe, you deduce, you solve.
The sound design is doing half the work. Every island has its own acoustic signature.
The story is delivered through journals you find. Elegant, atmospheric, strange."""

[[boards.threads.posts]]
id = 3
author = "31337"
subject = "Re: Myst -- puzzle game or interactive movie?"
timestamp = "09/26/93 02:45"
body = """
It's selling to people who own CD-ROMs and want something to show them off.
That demographic is larger than gamers think. This thing will move millions of units.
The cynical read: it's a tech demo. The honest read: the tech demo is the experience.
Point-and-click adventures needed this. Sierra and LucasArts take note."""

