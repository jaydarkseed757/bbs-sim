[[boards.threads]]
id = 2
subject = "Strike Commander -- resource hog or worth it?"

[[boards.threads.posts]]
id = 1
author = "31337"
subject = "Strike Commander -- resource hog or worth it?"
timestamp = "03/20/93 22:00"
body = """
Strike Commander from Origin requires a 486 and 8MB RAM minimum.
Most realistic flight sim I've seen -- full texture-mapped cockpit, real physics.
If your rig can handle it the dogfight mechanics are incredible.
The mercenary storyline is surprisingly engaging for a flight sim."""

[[boards.threads.posts]]
id = 2
author = "AceOfAces"
subject = "Re: Strike Commander -- resource hog or worth it?"
timestamp = "03/21/93 10:15"
body = """
Running it on a 486/66 with 16MB RAM and it's buttery smooth.
The speech pack makes a huge difference -- voice acting is solid.
Tactically it rewards learning formation flying and missile ranges.
Rowan Software's Red Baron is still better for WWI but for modern jets: this wins."""

[[boards.threads.posts]]
id = 3
author = "SceneKid"
subject = "Re: Strike Commander -- resource hog or worth it?"
timestamp = "03/22/93 15:00"
body = """
Upranged my RAM from 4 to 8MB specifically for this. No regrets.
The CD version with the full speech is the one to get.
Origin really does push the hardware envelope every single year."""

