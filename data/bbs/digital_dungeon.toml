[[boards.threads]]
id = 4
subject = "Betrayal at Krondor -- best writing in an RPG?"

[[boards.threads.posts]]
id = 1
author = "LoreDigger"
subject = "Betrayal at Krondor -- best writing in an RPG?"
timestamp = "04/01/93 20:00"
body = """
Just finished Betrayal at Krondor for the third time. The writing still hits.
Raymond E. Feist co-wrote the story directly and it shows.
The chapter-based structure with interlude poems and genuine plot twists.
Sierra published it but it plays nothing like their other games. A unique gem."""

[[boards.threads.posts]]
id = 2
author = "CrawlMaster"
subject = "Re: Betrayal at Krondor -- best writing in an RPG?"
timestamp = "04/02/93 10:30"
body = """
The chest riddles alone put it above 90% of the genre.
The combat is turn-based hex grid -- satisfying and tactical without being punishing.
Locklear is one of the better companions in RPG history. Actually has personality.
If you're coming from the Riftwar novels the fan service is generous."""

[[boards.threads.posts]]
id = 3
author = "ADnDFan"
subject = "Re: Betrayal at Krondor -- best writing in an RPG?"
timestamp = "04/03/93 18:15"
body = """
The overland map exploration reminds me of Might and Magic but classier.
The enemy scaling means you can tackle regions in non-linear order.
Return to Krondor is supposedly planned. Cannot happen fast enough.
Dynamix really committed to the Midkemia setting. Feels lived-in."""

[[boards.threads]]
id = 5
subject = "System Shock -- Looking Glass goes dark"

[[boards.threads.posts]]
id = 1
author = "DungeonMstr"
subject = "System Shock -- Looking Glass goes dark"
timestamp = "05/14/93 21:00"
body = """
Got a preview build of System Shock from a friend at Origin. This game is something else.
You're a hacker fighting a rogue AI called SHODAN on a space station.
The immersive sim engine from Ultima Underworld but darker, cyberpunkier.
The audio logs to build atmosphere instead of cutscenes -- brilliant and cheap. Smart design."""

[[boards.threads.posts]]
id = 2
author = "CrawlMaster"
subject = "Re: System Shock -- Looking Glass goes dark"
timestamp = "05/15/93 09:00"
body = """
SHODAN's voice lines from that preview are unsettling in a way most games never achieve.
"Insect" is going to be the gaming insult of 1994. Calling it now.
The full 3D environment with room above and below you changes everything about movement.
Looking Glass keep pushing what a game environment can be. They deserve all the hype."""

[[boards.threads.posts]]
id = 3
author = "RollD20"
subject = "Re: System Shock -- Looking Glass goes dark"
timestamp = "05/16/93 23:30"
body = """
The inventory and interface look dense but apparently it clicks once you're in.
Runs on a 486/33 minimum which is reasonable for what it's doing.
SHODAN as an antagonist is a real character not just a final boss obstacle.
The philosophical questions about artificial consciousness -- this is cyberpunk done right."""

