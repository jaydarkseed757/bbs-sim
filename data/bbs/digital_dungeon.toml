subject = "Planescape setting -- anyone running a campaign?"

[[boards.threads.posts]]
id = 1
author = "DiceGoblin"
subject = "Planescape setting -- anyone running a campaign?"
timestamp = "01/20/93 19:30"
body = """
TSR just released Planescape. The art direction from Tony DiTerlizzi is stunning.
The cant (faction language) takes getting used to but adds real texture.
Running a campaign set in Sigil with a Tiefling Thief as the main character.
The Lady of Pain as a background threat is deliciously ominous."""

[[boards.threads.posts]]
id = 2
author = "CampaignNerd"
subject = "Re: Planescape setting -- anyone running a campaign?"
timestamp = "01/21/93 14:00"
body = """
Ran a one-shot in Planescape last month to test the waters. Players loved it.
The multiplanar cosmology gives you literally infinite adventure space.
The faction politics in Sigil alone could sustain a years-long campaign.
DiTerlizzi's illustrations make everything feel alive and weird in the right way."""

[[boards.threads.posts]]
id = 3
author = "DungeonMstr"
subject = "Re: Planescape setting -- anyone running a campaign?"
timestamp = "01/22/93 22:15"
body = """
Converting my existing FR campaign to Planescape slowly.
Players found a portal accidentally and now they're in Mechanus.
The modrons are the most confusing and delightful NPCs I've ever used.
Highly recommend the Monstrous Compendium appendix -- brilliant creature design."""

[[boards.threads]]
id = 2
subject = "2nd Edition AD&D -- better or worse than 1st?"

[[boards.threads.posts]]
id = 1
author = "OldSchoolRoller"
subject = "2nd Edition AD&D -- better or worse than 1st?"
timestamp = "02/28/93 16:00"
body = """
Still running 1st edition. The weapon speed/segment system is fiddly but I love it.
2nd edition cleaned things up but lost some of the grit in the process.
The removal of Assassins and Half-Orcs as PC races still annoys me.
What does everyone prefer at the table?"""

[[boards.threads.posts]]
id = 2
author = "RollD20"
subject = "Re: 2nd Edition AD&D -- better or worse than 1st?"
timestamp = "03/01/93 11:00"
body = """
2nd Ed at my table. The THAC0 system actually makes sense once you internalize it.
Non-weapon proficiencies added meaningful character customization.
The Complete books (Priest, Wizard, Fighter, Thief) are excellent supplements.
The fluff is cleaner -- less chaotic than 1st edition's kitchen-sink approach."""

[[boards.threads.posts]]
id = 3
author = "DiceGoblin"
subject = "Re: 2nd Edition AD&D -- better or worse than 1st?"
timestamp = "03/02/93 20:30"
body = """
Use 2nd Ed rules but 1st Ed sensibility. Best of both worlds.
Keep demons and devils but use the 2nd Ed proficiency system.
The real answer is: whatever your table has fun with is the best edition.
Also AD&D 1st Ed hardcovers are getting cheap at used bookstores lately."""

