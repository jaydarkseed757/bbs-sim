[[boards.threads]]
id = 1
subject = "Ultima Underworld 2 -- best immersive sim yet?"

[[boards.threads.posts]]
id = 1
author = "DungeonMstr"
subject = "Ultima Underworld 2 -- best immersive sim yet?"
timestamp = "01/15/93 21:00"
body = """
UU2 dropped last month and I haven't left the dungeon since.
The full 3D world with physics and real-time movement still feels like magic.
The multiple worlds (Killorn Keep, Talorus, etc.) are all distinct and well-designed.
Origin is operating at a level no one else can touch right now."""

[[boards.threads.posts]]
id = 2
author = "RollD20"
subject = "Re: Ultima Underworld 2 -- best immersive sim yet?"
timestamp = "01/16/93 09:30"
body = """
Played both UU1 and UU2. The sequel is bigger but UU1 had tighter dungeon design.
The magic system in UU2 is deeper though -- rune combinations are satisfying to figure out.
My 486/33 handles it beautifully at 640x480. Worth every upgrade penny."""

[[boards.threads.posts]]
id = 3
author = "CrawlMaster"
subject = "Re: Ultima Underworld 2 -- best immersive sim yet?"
timestamp = "01/17/93 14:22"
body = """
The Looking Glass team is doing things no one else is attempting.
Real physics, genuine 3D space, NPCs with schedules.
System Shock is apparently their next project. I cannot wait."""

[[boards.threads]]
id = 2
subject = "Wizardry 7 party builds -- share yours"

[[boards.threads.posts]]
id = 1
author = "WizardKing"
subject = "Wizardry 7 party builds -- share yours"
timestamp = "02/10/93 20:00"
body = """
Running: Faerie Ninja, Lizardman Fighter, Rawulf Priest, Gnome Alchemist,
Human Bard, Mook Ranger. Bard's treasure finding has been clutch.
The Umpani questline is brutal without a solid fighter upfront.
What are other people running for the Rattkin section?"""

[[boards.threads.posts]]
id = 2
author = "DungeonMstr"
subject = "Re: Wizardry 7 party builds -- share yours"
timestamp = "02/11/93 08:15"
body = """
I went heavy on spellcasters: two Mages, a Priest, a Psionicist, Fighter, Ninja.
Late game the mage damage output is spectacular but early game was brutal.
Died a lot in the Umpani base until I found the armor vendor.
Bard is always worth it for the songs -- +AC and +to-hit adds up."""

[[boards.threads.posts]]
id = 3
author = "LoreDigger"
subject = "Re: Wizardry 7 party builds -- share yours"
timestamp = "02/12/93 22:40"
body = """
Ranger is underrated. Dual wield plus archery backup has saved me constantly.
The Crusaders of the Dark Savant storyline connecting to Wiz6 is brilliant.
If you didn't play 6 before 7 you're missing a lot of the narrative payoff."""

