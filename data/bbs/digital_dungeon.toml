subject = "GenCon 1993 -- anyone going to Milwaukee?"

[[boards.threads.posts]]
id = 1
author = "CampaignNerd"
subject = "GenCon 1993 -- anyone going to Milwaukee?"
timestamp = "06/15/93 20:00"
body = """
GenCon is August 19-22 in Milwaukee. Who's making the trip?
It's the biggest gaming convention in the country -- TSR basically owns it.
New releases from TSR, White Wolf, FASA all dropping at the con.
The auction hall alone is worth the drive."""

[[boards.threads.posts]]
id = 2
author = "DiceGoblin"
subject = "Re: GenCon 1993 -- anyone going to Milwaukee?"
timestamp = "06/16/93 09:30"
body = """
Going for the third year. If you haven't been: the auction is where to be.
First editions, rare modules, out of print supplements at fair prices.
The seminar schedule is packed with designers. The FASA Shadowrun team is presenting.
If you're in the midwest and call yourself a gamer there's no excuse not to go."""

[[boards.threads.posts]]
id = 3
author = "OldSchoolRoller"
subject = "Re: GenCon 1993 -- anyone going to Milwaukee?"
timestamp = "06/17/93 15:00"
body = """
Got my hotel booked. Staying at the Hyatt near the convention center.
Bring a cart for the dealer room -- you will buy more than you planned.
The Thursday night games are where the real memories get made. Sign up early.
TSR always has a big announcement Friday morning. Worth being there for."""
