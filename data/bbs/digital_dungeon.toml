subject = "Origins Awards 1993 -- predictions?"
timestamp = "04/01/93 14:00"
body = """
Origins is in July this year. Predictions for the game awards?
Best RPG is probably Planescape or Shadowrun 2nd Ed for tabletop.
Computer RPG is trickier -- Ultima Underworld 2 or Ultima VII Serpent Isle?
Dark Sun: Wake of the Ravager is also in the running I think."""

[[boards.threads.posts]]
id = 2
author = "DiceGoblin"
subject = "Re: Origins Awards 1993 -- predictions?"
timestamp = "04/02/93 09:00"
body = """
Going with Planescape for best RPG. TSR marketing machine will push it hard.
Computer side: Ultima VII Serpent Isle is stunning but UU2 might edge it.
The Ultima franchise has dominated that category for three years running.
Dark Sun is a dark horse -- the atrocity cards mechanic is genuinely innovative."""
