subject = "World Trade Center bombing -- what happened?"

[[boards.threads.posts]]
id = 1
author = "NewsFreak_IL"
subject = "World Trade Center bombing -- what happened?"
timestamp = "02/27/93 18:00"
body = """
A bomb went off in the WTC parking garage this afternoon. Six dead, hundreds injured.
Massive truck bomb in the underground lot. The towers didn't fall but the damage is severe.
FBI is treating as terrorism. Early reports suggest foreign connection.
This is a different kind of threat than we've seen on domestic soil."""

[[boards.threads.posts]]
id = 2
author = "ConductorX"
subject = "Re: World Trade Center bombing -- what happened?"
timestamp = "02/28/93 09:15"
body = """
The intended effect was clearly to topple one tower into the other.
The structural engineering held -- those buildings are overbuilt by design.
Six dead is six too many but it could have been thousands.
The investigation is going to be interesting. This required real logistics."""

[[boards.threads]]
id = 2
subject = "Space shuttle Discovery -- STS-56 mission"

[[boards.threads.posts]]
id = 1
author = "StarGazer_CHI"
subject = "Space shuttle Discovery -- STS-56 mission"
timestamp = "04/08/93 15:00"
body = """
Discovery launched today on STS-56, the ATLAS-2 atmospheric research mission.
This is the good stuff -- measuring ozone depletion data, greenhouse gases.
The political football of climate science needs this kind of hard data.
Five astronauts up there doing real science while we argue about everything else."""

[[boards.threads.posts]]
id = 2
author = "NewsFreak_IL"
subject = "Re: Space shuttle Discovery -- STS-56 mission"
timestamp = "04/09/93 10:30"
body = """
The LIDAR instrument on this mission is particularly interesting.
Atmospheric profiling in 3D -- we'll have a much better ozone depletion map.
The post-Challenger skepticism about shuttle safety has faded but the program
still needs a clearer direction. What's after station assembly?"""

