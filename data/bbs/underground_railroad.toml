The sausage quality is also a cut above. No contest."""

[[boards.threads.posts]]
id = 2
author = "ChiTownFoodie"
subject = "Re: Best Chicago deep dish -- settle this debate"
timestamp = "01/16/93 12:30"
body = """
Giordano's stuffed is a different category than deep dish. It's stuffed pizza.
If we're comparing apples to apples: Malnati's on butter crust, Uno's on history.
But the correct Chicago pizza is thin crust tavern style. Fight me."""
