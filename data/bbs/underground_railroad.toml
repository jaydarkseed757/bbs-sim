[[boards.threads]]
id = 3
subject = "Flooding in the Midwest -- worst in decades"

[[boards.threads.posts]]
id = 1
author = "NewsFreak_IL"
subject = "Flooding in the Midwest -- worst in decades"
timestamp = "07/15/93 20:00"
body = """
The Mississippi and Missouri rivers are at record levels. Unprecedented flooding.
Des Moines lost its water treatment plant. The city is without clean water.
Illinois, Iowa, Missouri, Minnesota all in emergency status.
The scale of this is hard to communicate. Drive 20 miles and it's underwater."""

[[boards.threads.posts]]
id = 2
author = "ConductorX"
subject = "Re: Flooding in the Midwest -- worst in decades"
timestamp = "07/16/93 10:00"
body = """
The Des Moines water situation is the logistical nightmare -- bottled water for 250,000 people.
Army Corps of Engineers is on every levee that's still holding.
The climate science community has been saying extreme weather events will increase.
This is what "increase" looks like. The argument about causation can wait; people need help."""

[[boards.threads.posts]]
id = 3
author = "LaborWatch"
subject = "Re: Flooding in the Midwest -- worst in decades"
timestamp = "07/17/93 15:30"
body = """
The farm losses are going to be catastrophic. Corn and soybean crop devastated.
The flood insurance situation is a mess -- many farmers couldn't afford it.
The economic ripple effect hits food prices by fall. Planning accordingly.
FEMA response so far is better than usual but the scale is overwhelming."""

[[boards.threads]]
id = 4
subject = "Jurassic Park box office -- what does this mean for film?"

[[boards.threads.posts]]
id = 1
author = "StarGazer_CHI"
subject = "Jurassic Park box office -- what does this mean for film?"
timestamp = "06/20/93 16:00"
body = """
Jurassic Park made $50 million opening weekend. Heading toward $100M domestic fast.
The CGI dinosaurs have shifted the conversation about practical effects permanently.
ILM just changed the art form. Stop-motion dinosaurs are instantly obsolete.
The Oscars are going to grapple with what counts as filmmaking craft now."""

[[boards.threads.posts]]
id = 2
author = "NewsFreak_IL"
subject = "Re: Jurassic Park box office -- what does this mean for film?"
timestamp = "06/21/93 10:30"
body = """
The business story: this is the template for the summer blockbuster going forward.
Huge IP, massive effects budget, family-friendly PG-13, global release.
Spielberg just showed the studios what the formula looks like at maximum scale.
Terminator 2 pointed the way; Jurassic Park kicked the door off its hinges."""

[[boards.threads.posts]]
id = 3
author = "ChiTownFoodie"
subject = "Re: Jurassic Park box office -- what does this mean for film?"
timestamp = "06/22/93 22:00"
body = """
The kids-in-danger aspect is what makes it work. Spielberg knows how to weaponize that.
The raptor kitchen scene scared my twelve-year-old cousin so badly she's still talking about it.
You can have all the tech in the world; if the characters don't matter it's screensavers.
Spielberg understands the difference. Not everyone who'll try to copy this will."""

