[[boards.threads]]
id = 4
subject = "Chicago tech scene -- is there one?"

[[boards.threads.posts]]
id = 1
author = "ConductorX"
subject = "Chicago tech scene -- is there one?"
timestamp = "04/25/93 20:00"
body = """
Everyone talks about Silicon Valley, Seattle (Microsoft), Boston (Route 128).
Chicago: we have Ameritech, Motorola in the suburbs, some finance tech shops.
The startup culture doesn't feel like it's here. No venture capital ecosystem.
Am I missing something or is the Chicago tech scene a polite fiction?"""

[[boards.threads.posts]]
id = 2
author = "EconMajor93"
subject = "Re: Chicago tech scene -- is there one?"
timestamp = "04/26/93 10:30"
body = """
The commodity trading tech at the CME and CBOT is world class. Just not visible.
The financial engineering happening in the Loop is sophisticated.
The consumer/startup scene: you're right, it's thin. Chicago talent leaves for coasts.
The UIC and Northwestern pipeline produces good people who don't stay."""

[[boards.threads.posts]]
id = 3
author = "NewsFreak_IL"
subject = "Re: Chicago tech scene -- is there one?"
timestamp = "04/27/93 18:00"
body = """
Motorola's cellular division in Schaumburg is legitimately important.
The DynaTAC team invented the cell phone. The StarTAC is coming. Real innovation.
The problem is it's all suburban corporate, not city startup culture.
Chicago's strength is logistics, finance, manufacturing tech -- not software startups."""

[[boards.threads.posts]]
id = 4
author = "LaborWatch"
subject = "Re: Chicago tech scene -- is there one?"
timestamp = "04/28/93 09:00"
body = """
The BBS scene here is stronger than people admit. Twenty active boards that I know of.
We're building community infrastructure and nobody's calling it a tech scene.
The informal network of people who run BBSes, write software, share knowledge.
That's a scene. It just doesn't have venture capital so nobody counts it."""
