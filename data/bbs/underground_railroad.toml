[[boards.threads]]
id = 4
subject = "The information superhighway -- real or vaporware?"

[[boards.threads.posts]]
id = 1
author = "ConductorX"
subject = "The information superhighway -- real or vaporware?"
timestamp = "05/10/93 20:00"
body = """
The Clinton administration keeps talking about the National Information Infrastructure.
Gore's "information superhighway" is the metaphor everyone's running with now.
The actual policy: deregulation, private investment, universal access goals.
The gap between the rhetoric and what will actually get built in poor neighborhoods: large."""

[[boards.threads.posts]]
id = 2
author = "EconMajor93"
subject = "Re: The information superhighway -- real or vaporware?"
timestamp = "05/11/93 10:00"
body = """
The cable and phone company lobbying is going to shape this more than any White House plan.
Whoever controls the pipes controls the future. They know this. Do we?
The open internet as it exists today survives on academic infrastructure.
Commercialization is coming. The question is whether openness survives it."""

[[boards.threads.posts]]
id = 3
author = "LaborWatch"
subject = "Re: The information superhighway -- real or vaporware?"
timestamp = "05/12/93 19:30"
body = """
The universal access question is the one I care about.
Rural America, low-income urban neighborhoods: what does this future include them?
The market will wire profitable areas first. Government has to mandate the rest.
Without that commitment the information superhighway runs through suburbs only."""

[[boards.threads]]
id = 5
subject = "Somalia -- what are we doing there?"

[[boards.threads.posts]]
id = 1
author = "PoliticWatcher"
subject = "Somalia -- what are we doing there?"
timestamp = "06/05/93 14:00"
body = """
The UN operation in Somalia is escalating. We went in for humanitarian relief.
Now US forces are actively hunting Aidid after the June 5th ambush on Pakistani troops.
The mission has crept dramatically. There's no clear exit condition.
This is the pattern: good intentions, mission creep, no endgame."""

[[boards.threads.posts]]
id = 2
author = "NewsFreak_IL"
subject = "Re: Somalia -- what are we doing there?"
timestamp = "06/06/93 09:00"
body = """
The Black Hawk fleet is doing the heavy lifting on the hunt for Aidid.
Urban combat in Mogadishu is a different war than anything in the Gulf.
No front lines, no uniforms, civilian populations as cover.
The Pentagon is not being straight with the American people about what this looks like."""

[[boards.threads.posts]]
id = 3
author = "ConductorX"
subject = "Re: Somalia -- what are we doing there?"
timestamp = "06/07/93 18:00"
body = """
The humanitarian case was real and the initial operation was right.
The switch to nation-building without a plan for what that means: that's the failure.
Clinton inherited Bush Sr.'s commitment and can't easily reverse it.
Watch the fall. I think this ends badly and the lessons won't be learned."""

