[[boards.threads.posts]]
id = 1
author = "PixelPusher"
subject = "VGA vs SVGA -- real difference?"
timestamp = "04/15/93 21:00"
body = """
My friend says SVGA is just marketing hype.
Is 800x600 actually noticeably better or is 320x200 good enough?"""

[[boards.threads.posts]]
id = 2
author = "GfxGuru"
subject = "Re: VGA vs SVGA -- real difference?"
timestamp = "04/16/93 00:15"
body = """
For games? 320x200 Mode 13h is king -- palette tricks look amazing.
For productivity and Windows? 800x600 is a huge difference.
Get a Diamond Stealth VGA with 1MB VRAM and you can do both."""

[[boards.threads.posts]]
id = 3
author = "PcJockey"
subject = "Re: VGA vs SVGA -- real difference?"
timestamp = "04/16/93 09:30"
body = """
Running a Cirrus Logic 512KB card at 800x600 right now.
Windows 3.1 is a whole different experience at higher res.
Still use 320x200 for gaming though -- the dithered palette tricks are art."""
