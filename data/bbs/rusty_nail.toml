[[boards.threads]]
id = 1
subject = "DOS 6.0 -- worth upgrading?"

[[boards.threads.posts]]
id = 1
author = "PcJockey"
subject = "DOS 6.0 -- worth upgrading?"
timestamp = "03/31/93 10:00"
body = """
Microsoft just dropped DOS 6.0. DoubleSpace looks interesting
but I've heard scary stories about it eating whole drives.
Anyone tried it yet? Worth the $50 upgrade?"""

[[boards.threads.posts]]
id = 2
author = "TechWiz"
subject = "Re: DOS 6.0 -- worth upgrading?"
timestamp = "04/01/93 08:21"
body = """
DoubleSpace is risky. Stick with Stacker if you need compression.
MemMaker is legit though -- freed up 47k of conventional RAM for me.
MultiConfig boot menus alone make it worth it."""

[[boards.threads.posts]]
id = 3
author = "NeonByte"
subject = "Re: DOS 6.0 -- worth upgrading?"
timestamp = "04/02/93 16:09"
body = """
MultiConfig in CONFIG.SYS is the killer feature.
Boot menu between DOS gaming config and Windows config? Yes please.
Finally I can have HIMEM and EMM386 only when I need them."""

