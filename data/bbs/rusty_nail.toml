[[boards.threads]]
id = 2
subject = "SwiftLink vs UserPort modem -- which is faster?"

[[boards.threads.posts]]
id = 1
author = "ModemWrangler"
subject = "SwiftLink vs UserPort modem -- which is faster?"
timestamp = "04/08/93 10:00"
body = """
Running a userport modem at 1200 baud right now. Considering upgrading.
SwiftLink cartridge can allegedly do 38400 -- is that real or hype?
What are people actually seeing in practice on the C64?"""

[[boards.threads.posts]]
id = 2
author = "PhreakMaster"
subject = "Re: SwiftLink vs UserPort modem -- which is faster?"
timestamp = "04/08/93 22:47"
body = """
SwiftLink is the real deal. Running 38400 here with a 14.4k external modem.
The C64's 6551 ACIA chip handles it fine with the right software.
CCGMS Term is what you want. NovaTerm also works great.
Night and day difference from userport."""

