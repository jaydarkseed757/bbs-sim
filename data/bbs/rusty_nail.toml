[[boards.threads]]
id = 4
subject = "Emulator talk -- can a C64 ever be emulated properly?"

[[boards.threads.posts]]
id = 1
author = "SidHead"
subject = "Emulator talk -- can a C64 ever be emulated properly?"
timestamp = "06/01/93 22:00"
body = """
Seen a few C64 emulators floating around for DOS. None of them sound right.
The SID chip has analog quirks that pure digital emulation can't capture.
The 6510 timing relative to the VIC-II is also incredibly precise.
I don't think software will ever fully replicate what the hardware does."""

[[boards.threads.posts]]
id = 2
author = "ModemWrangler"
subject = "Re: Emulator talk -- can a C64 ever be emulated properly?"
timestamp = "06/02/93 11:00"
body = """
Frodo and C64S are the best I've tried. Both are usable but neither is perfect.
The VIC-II border tricks and sprite multiplexing are the hardest parts to get right.
Some demos flat out break in emulators because of cycle-exact timing requirements.
A dedicated ASIC replacement would do better than software. Someone should build one."""

[[boards.threads.posts]]
id = 3
author = "8BitWitch"
subject = "Re: Emulator talk -- can a C64 ever be emulated properly?"
timestamp = "06/03/93 17:45"
body = """
The SID analog filter is a known problem. The resonance behavior is almost random.
Different C64 boards from different years sound slightly different because of chip variance.
A proper emulator would need to model the specific chip revision you own.
This is why we keep the real hardware. Nothing beats the machine itself."""

# ── Tech Talk additions ────────────────────────────────────────────────────────

[[boards.threads]]
id = 3
subject = "Windows NT 3.1 -- Microsoft gets serious"

[[boards.threads.posts]]
id = 1
author = "PcJockey"
subject = "Windows NT 3.1 -- Microsoft gets serious"
timestamp = "07/27/93 10:00"
body = """
Windows NT 3.1 shipped this week. Preemptive multitasking, true 32-bit, protected memory.
This is not Windows 3.1 with extra steps -- it's a ground-up OS from Dave Cutler's team.
Minimum 12MB RAM makes it impractical for most but the architecture is solid.
Microsoft finally has an OS that can compete with Unix workstations."""

[[boards.threads.posts]]
id = 2
author = "TechWiz"
subject = "Re: Windows NT 3.1 -- Microsoft gets serious"
timestamp = "07/28/93 09:00"
body = """
The NT kernel is genuinely impressive. HAL architecture, full memory protection.
Application isolation means a crashed app doesn't take the OS down. Novel concept.
It runs on MIPS and Alpha too, not just x86. Microsoft is thinking long-term.
The 12MB minimum is 16MB realistic -- not exactly a home machine OS yet."""

[[boards.threads.posts]]
id = 3
author = "NeonByte"
subject = "Re: Windows NT 3.1 -- Microsoft gets serious"
timestamp = "07/29/93 14:20"
body = """
Installed it on a 486/33 with 16MB. Slow. Like, noticeably slow.
The stability is excellent though -- ran it for a week without a crash.
On a workstation with real RAM it probably sings. Not a gaming OS either way.
Windows 3.11 for Workgroups is still the right answer for most users."""

[[boards.threads.posts]]
id = 4
author = "DataSurfer"
subject = "Re: Windows NT 3.1 -- Microsoft gets serious"
timestamp = "07/30/93 02:00"
body = """
What's interesting is the POSIX subsystem. Unix apps can theoretically run on NT.
The Win32 API is cleaner than the 16-bit mess of regular Windows.
Five years from now NT is going to be everywhere in offices.
Home users will stay on DOS/Windows 3.x for gaming another decade at least."""

[[boards.threads]]
id = 4
subject = "CD-ROM drives -- is 2x enough or go 4x?"

[[boards.threads.posts]]
id = 1
author = "GfxGuru"
subject = "CD-ROM drives -- is 2x enough or go 4x?"
timestamp = "05/18/93 20:00"
body = """
Budget 2x drives are around $200 now. 4x drives are $500+.
For games: 2x is fine. Myst won't play well on 1x but 2x handles it.
For video (Kodak Photo CD, FMV games): 4x makes a real difference.
The access time matters more than transfer rate for most game usage."""

[[boards.threads.posts]]
id = 2
author = "PixelPusher"
subject = "Re: CD-ROM drives -- is 2x enough or go 4x?"
timestamp = "05/19/93 11:00"
body = """
Picked up a NEC CDR-84 2x last month for $220. No regrets.
The jump from 1x to 2x is huge. The jump from 2x to 4x is marginal for games.
The interface matters: SCSI is faster and more reliable than the proprietary connectors.
Avoid the Mitsumi and Panasonic proprietary interfaces if you can. Get SCSI."""

[[boards.threads.posts]]
id = 3
author = "PcJockey"
subject = "Re: CD-ROM drives -- is 2x enough or go 4x?"
timestamp = "05/20/93 22:30"
body = """
The real future argument for CD-ROM: game sizes are exploding.
Myst on 5.5MB floppy would be 30+ disks. On CD it's one disc.
Wing Commander games already needed 6+ floppies. CD is inevitable.
Buy now, buy 2x minimum. The content ecosystem is building fast."""
