[[boards.threads]]
id = 4
subject = "ISDN -- is residential deployment coming?"

[[boards.threads.posts]]
id = 1
author = "TelcoGhost"
subject = "ISDN -- is residential deployment coming?"
timestamp = "05/01/93 21:00"
body = """
ISDN Basic Rate Interface: 2B+D, 128kbps data on a single phone line.
The Baby Bells have it available in metro areas but pricing is punishing.
$50-100/month plus installation fees in most markets. Not consumer-friendly.
The technology is there. The business case for pricing it right isn't."""

[[boards.threads.posts]]
id = 2
author = "Pr0phet"
subject = "Re: ISDN -- is residential deployment coming?"
timestamp = "05/02/93 09:30"
body = """
128kbps is 17x what a 14.4k modem delivers. That's a different internet experience.
Video conferencing, large file transfers, real-time collaboration -- ISDN enables it all.
The problem: telcos make more money on voice calls than data connections.
Pricing will follow demand. Demand will follow pricing. Deadlock."""

[[boards.threads.posts]]
id = 3
author = "RingMaster"
subject = "Re: ISDN -- is residential deployment coming?"
timestamp = "05/03/93 14:00"
body = """
The Clinton NII (National Information Infrastructure) initiative could change the math.
Government subsidy for high-speed residential access is on the table.
The phone companies will take the money and still charge retail rates. Watch.
Cable modem technology is the wild card -- coax has far more bandwidth than copper."""

[[boards.threads]]
id = 5
subject = "War dialing -- tools and ethics"

[[boards.threads.posts]]
id = 1
author = "CoinOp"
subject = "War dialing -- tools and ethics"
timestamp = "06/10/93 02:00"
body = """
ToneLoc is the standard war dialer now. Scans a range of numbers for modem carriers.
The ethics: scanning numbers you don't own is legally grey at minimum.
The knowledge: understanding what's out there on the PSTN is legitimate curiosity.
Where's the line? I'll say this: documenting vulnerabilities so they can be patched."""

[[boards.threads.posts]]
id = 2
author = "Pr0phet"
subject = "Re: War dialing -- tools and ethics"
timestamp = "06/10/93 10:00"
body = """
The Computer Fraud and Abuse Act covers unauthorized access, not scanning.
Dialing a number is not unauthorized access. Connecting to the carrier is a grey area.
The responsible path: document what you find, notify the owner, move on.
Actual exploitation is where curiosity becomes crime. Know the line."""

[[boards.threads.posts]]
id = 3
author = "TelcoGhost"
subject = "Re: War dialing -- tools and ethics"
timestamp = "06/11/93 00:30"
body = """
The interesting finds these days aren't modems -- they're voice mail systems.
PBX voicemail bridges are everywhere and most have default passwords still set.
Corporate PBXs with outbound access: that's where the risk lives.
The telcos know these are there. They don't patch them. The liability is interesting."""

