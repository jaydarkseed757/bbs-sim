[[boards.threads]]
id = 3
subject = "Anonymous remailers -- protecting digital identity"

[[boards.threads.posts]]
id = 1
author = "CyberLiberty"
subject = "Anonymous remailers -- protecting digital identity"
timestamp = "04/15/93 21:00"
body = """
Penet.fi is the best-known anonymous remailer right now. Based in Finland.
You send email through it, the remailer strips headers and forwards anonymously.
The logs exist but are protected by Finnish privacy law. Better than US-based.
For Usenet posts especially: an anonymous voice is sometimes the only honest one."""

[[boards.threads.posts]]
id = 2
author = "DataJockey"
subject = "Re: Anonymous remailers -- protecting digital identity"
timestamp = "04/16/93 09:00"
body = """
The cypherpunk remailer network is the more sophisticated solution.
Chained remailers: message goes through 5-10 nodes, each only knowing the next hop.
Nobody in the chain has the full picture. Much stronger than single-remailer anonymity.
Cypherpunks mailing list has the technical specs if you want to run a node yourself."""

[[boards.threads.posts]]
id = 3
author = "Pr0phet"
subject = "Re: Anonymous remailers -- protecting digital identity"
timestamp = "04/17/93 02:00"
body = """
The threat model matters. Who are you hiding from?
Penet is fine for avoiding employer surveillance. Not fine if the NSA is interested.
Full cypherpunk chain with PGP encryption at each hop: much harder to trace.
The technical and legal protections need to reinforce each other. Neither alone is enough."""

[[boards.threads]]
id = 4
subject = "Steve Jackson Games v. Secret Service -- EFF wins"

[[boards.threads.posts]]
id = 1
author = "CyberLiberty"
subject = "Steve Jackson Games v. Secret Service -- EFF wins"
timestamp = "03/12/93 20:00"
body = """
The EFF just won in federal court. Steve Jackson Games gets $50,000 in damages.
The Secret Service seized SJG's BBS and computers in 1990 over a game book.
GURPS Cyberpunk: the government thought it was a hacking manual. A game book.
This case established that BBS operators have legal protections. Historic."""

[[boards.threads.posts]]
id = 2
author = "TelcoGhost"
subject = "Re: Steve Jackson Games v. Secret Service -- EFF wins"
timestamp = "03/13/93 10:30"
body = """
The Electronic Communications Privacy Act protections were upheld in full.
Law enforcement can't just seize a BBS and read all the private messages.
The precedent covers us. Every BBS sysop in the country should know this case.
Mitchell Kapor and John Perry Barlow built something important with the EFF."""

[[boards.threads.posts]]
id = 3
author = "Pr0phet"
subject = "Re: Steve Jackson Games v. Secret Service -- EFF wins"
timestamp = "03/14/93 00:00"
body = """
The chilling effect from the 1990 raids is still real three years later.
Sysops shut down boards, users self-censored, entire communities scattered.
This ruling is the correction. It won't undo the damage but it sets the rule.
The government learned something. So did we. The fight continues either way."""

