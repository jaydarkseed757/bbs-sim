[[boards.threads]]
id = 1
subject = "The Hacker Crackdown -- required reading"

[[boards.threads.posts]]
id = 1
author = "Pr0phet"
subject = "The Hacker Crackdown -- required reading"
timestamp = "01/20/93 22:00"
body = """
Bruce Sterling put The Hacker Crackdown online for free distribution.
If you haven't read it you're missing the best account of Operation Sundevil
and the formation of the EFF. Sterling's journalism is exceptional.
Mandatory reading for anyone who cares about digital rights."""

[[boards.threads.posts]]
id = 2
author = "CyberLiberty"
subject = "Re: The Hacker Crackdown -- required reading"
timestamp = "01/21/93 10:00"
body = """
Read it twice. The Steve Jackson Games raid chapter is infuriating.
The Secret Service seized a game book thinking it was a hacking manual.
The EFF was founded partly in response to that specific incident.
Kapor and Barlow deserve enormous credit for organizing the legal defense."""

[[boards.threads.posts]]
id = 3
author = "TelcoGhost"
subject = "Re: The Hacker Crackdown -- required reading"
timestamp = "01/22/93 15:30"
body = """
The long-term effect of that wave of raids was chilling for legitimate research.
Security through obscurity protects no one -- sunlight is the best disinfectant.
Sterling understood that instinctively. The book holds up.
The EFF's work on ECPA reform is the practical follow-through."""

[[boards.threads]]
id = 2
subject = "Cyberpunk -- Neuromancer vs Snow Crash"

[[boards.threads.posts]]
id = 1
author = "Pr0phet"
subject = "Cyberpunk -- Neuromancer vs Snow Crash"
timestamp = "03/10/93 20:00"
body = """
Two giants of the genre. Which holds up better in '93?
Neuromancer invented the vocabulary. Snow Crash is funnier and more prescient
about where computing is actually heading -- the Metaverse idea is inevitable.
Gibson's prose style is unmatched but Stephenson's ideas are more actionable."""

[[boards.threads.posts]]
id = 2
author = "DataJockey"
subject = "Re: Cyberpunk -- Neuromancer vs Snow Crash"
timestamp = "03/11/93 08:30"
body = """
This is a false choice. Read Stephenson for the ideas, Gibson for the language.
Neuromancer's cyberspace metaphor -- while dated in implementation -- captures
something real about how information feels to move through.
Snow Crash's pizza delivery economics is the funniest opening chapter in SF."""

[[boards.threads.posts]]
id = 3
author = "CyberLiberty"
subject = "Re: Cyberpunk -- Neuromancer vs Snow Crash"
timestamp = "03/12/93 14:15"
body = """
Hot take: Vernor Vinge's "True Names" (1981) predates both and is still the best.
Online identity and virtual reality handled with more precision than either.
Available as shareware from several archives. Track it down.
Also: Count Zero is underrated. The Virek storyline is Gibson at his best."""

