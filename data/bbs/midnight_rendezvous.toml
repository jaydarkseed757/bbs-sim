[[boards.threads]]
id = 1
subject = "SS7 signaling -- the basics"

[[boards.threads.posts]]
id = 1
author = "Pr0phet"
subject = "SS7 signaling -- the basics"
timestamp = "03/01/93 01:00"
body = """
SS7 (Signaling System 7) is how the phone network actually routes calls.
It's a separate packet-switched network running alongside the voice circuits.
All those 800 numbers, caller ID, call forwarding -- SS7 does the bookkeeping.
Understanding it is understanding how the PSTN actually works under the hood."""

[[boards.threads.posts]]
id = 2
author = "TelcoGhost"
subject = "Re: SS7 signaling -- the basics"
timestamp = "03/02/93 10:30"
body = """
Good intro. The STPs (Signal Transfer Points) are the routing nodes.
SSPs are the switches that connect to SS7. SCPs are the databases.
800 number portability is an SCP function -- that's why it works across carriers.
The 2600 magazine has had some good technical breakdowns of the architecture."""

[[boards.threads.posts]]
id = 3
author = "RingMaster"
subject = "Re: SS7 signaling -- the basics"
timestamp = "03/03/93 23:15"
body = """
The CAP (CAMEL Application Part) extensions are interesting for international calls.
The GSM networks coming online are hooking into SS7 for roaming.
Wireless is going to change everything about how we think about the PSTN.
The Bellcore documentation is worth tracking down if you can find it."""

[[boards.threads]]
id = 2
subject = "COCOT phones -- a comprehensive guide"

[[boards.threads.posts]]
id = 1
author = "CoinOp"
subject = "COCOT phones -- a comprehensive guide"
timestamp = "02/10/93 20:00"
body = """
COCOTs (Customer-Owned Coin-Operated Telephones) are the private payphones.
Unlike RBOC payphones they're not regulated the same way.
The programming interfaces vary wildly by manufacturer.
Worth studying purely from an engineering curiosity standpoint."""

[[boards.threads.posts]]
id = 2
author = "Pr0phet"
subject = "Re: COCOT phones -- a comprehensive guide"
timestamp = "02/11/93 08:45"
body = """
The Elcotel and Pacific Bell COCOT models are the most common in NYC.
The coin processing logic is surprisingly simple -- just voltage sensing.
The 2600 Hz tone that gives the magazine its name: still relevant on analog trunks.
Old analog switching gear is being phased out fast though. Get the knowledge now."""

[[boards.threads.posts]]
id = 3
author = "TelcoGhost"
subject = "Re: COCOT phones -- a comprehensive guide"
timestamp = "02/12/93 14:00"
body = """
A lot of this hardware knowledge becomes museum-piece in 5-10 years.
Digital switching is replacing the old electromechanical stuff rapidly.
Documenting it now while it's still in use is genuinely valuable.
The engineering elegance of analog telephony is real -- a beautiful system."""

[[boards.threads]]
id = 3
subject = "Best resources for learning telecom from scratch"

[[boards.threads.posts]]
id = 1
author = "NewToTelco"
subject = "Best resources for learning telecom from scratch"
timestamp = "04/05/93 19:00"
body = """
Just getting into this. Where do I start to understand how the phone network works?
I've read some 2600 issues but the technical depth is hard to follow without background.
Any books, documents, or BBSes you'd recommend for a beginner?"""

[[boards.threads.posts]]
id = 2
author = "Pr0phet"
subject = "Re: Best resources for learning telecom from scratch"
timestamp = "04/06/93 00:30"
body = """
Start with: "The Hacker Crackdown" by Bruce Sterling. Free on the internet.
Then: Bellcore technical documents -- some are publicly available.
The TAP newsletter archives are worth reading for history context.
And obviously 2600 back issues. Start from 1984 and work forward."""

[[boards.threads.posts]]
id = 3
author = "TelcoGhost"
subject = "Re: Best resources for learning telecom from scratch"
timestamp = "04/06/93 11:15"
body = """
The classic "Understanding Telephone Electronics" by Texas Instruments is solid.
Also "The Telephone System" by AT&T -- older but the fundamentals haven't changed.
For digital: any ISDN primer will teach you the modern architecture.
The real learning is tinkering. Get an old 2500 set and trace what happens when you dial."""

