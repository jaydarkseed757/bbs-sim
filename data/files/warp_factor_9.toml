kind = "text"
content = """
STAR TREK: THE NEXT GENERATION -- SEASON 6 EPISODE NOTES
Compiled by KirkFan for WARP FACTOR 9 BBS

Season 6 is airing now (1992-93). Running commentary as episodes air.

TAPESTRY (Air date: Feb 15, 1993)
Q gives Picard a chance to relive the fight where he lost his artificial
heart. If he'd been more cautious, he'd have survived... but become a
mediocre lieutenant who never made captain. The message is blunt but the
execution is excellent. One of the best Q episodes.

CHAIN OF COMMAND (Part 1 & 2, Dec 1992)
Picard is captured by Cardassians and tortured. "There are FOUR lights."
Riker has to deal with a new captain (Jellico) who is abrasive but not
wrong. The Picard torture scenes are the most mature thing this show has
attempted. Based loosely on 1984.

SCHISMS (Oct 1992)
Crew members are being abducted and experimented on by beings from
subspace. Unsettling in a way Trek rarely is. The recreation of the
alien operating table from crew descriptions is a great scene.

FACE OF THE ENEMY (Feb 1993)
Troi wakes up surgically altered to look like a Romulan. She has to
improvise her way through a Romulan warbird without blowing her cover.
One of Sirtis's best performances -- she's genuinely tense throughout.

BIRTHRIGHT (Part 1 & 2, Feb 1993)
Worf finds a settlement of Klingon POWs who have assimilated with
Romulans and no longer care about Klingon honor. Part 2 is a quiet
meditation on cultural identity that Trek rarely attempts.

RELICS (Oct 1992)
Scotty is found in transporter stasis after 75 years. The writers
handle the "out of time" character well -- he's not played for laughs.
The holodeck Enterprise-A scene is exactly as good as you want it to be.

UPCOMING:
- Timescape (temporal anomaly episode, looks good)
- Descent (Borg + Data emotion, season finale)

Overall: strongest season since S3. The show has figured out what it is.

-- KirkFan / WARP FACTOR 9
"""

