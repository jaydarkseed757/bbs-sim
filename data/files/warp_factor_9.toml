kind = "text"
content = """
SNOW CRASH -- NOTES AND DISCUSSION
Posted to WARP FACTOR 9 by DataJockey, April 1993

Neal Stephenson's _Snow Crash_ came out last year and I've been sitting
with it long enough to put down some thoughts.

THE SETUP:

Hiro Protagonist is a freelance hacker/pizza deliveryman in a near-future
America where the federal government has collapsed and everything is run
by franchise operations (the Mafia runs pizza, the Feds run a franchise
called the FBI, etc.). He spends half his time in the Metaverse -- a
shared virtual reality built on a protocol anyone can write clients for.

THE METAVERSE:

The Street is a single endless avenue 65536 km in circumference. Property
on the Street can be purchased and developed. Your avatar is limited by
your hardware -- rich people have photorealistic avatars, poor people use
black-and-white low-poly models.

This is going to look prophetic. The web + persistent 3D space + avatar
identity is where this is going. Not in 1993, but by 2000? Maybe.

THE LINGUISTIC ANGLE:

The plot eventually involves a Sumerian "neurolinguistic" virus that can
reprogram humans at a deep level -- the idea being that early human
cognition was more like a computer running interpreted bytecode, and
Asherah's virus exploits that substrate.

Stephenson pulls in Chomsky's deep structure, Godel-Escher-Bach style
recursion, and actual Sumerian mythology. It's ambitious to the point of
being slightly ridiculous, but it works because he commits to it.

The climax involves Snow Crash -- the visual equivalent of the virus that
crashes avatar software (written in assembly) and can affect human
operators.

VERDICT:

The first 100 pages are the best cyberpunk writing since Neuromancer. The
ending is a bit rushed. The Raven character is great. Y.T. is great.

Read it. Then read it again and pay attention to the linguistics chapters.

-- DataJockey
"""

