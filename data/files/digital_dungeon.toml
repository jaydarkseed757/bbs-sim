[[sections.files]]
id = 6
name = "DUNGEON_GM.TXT"
size = "8K"
date = "04/10/93"
description = "Running better dungeons -- DM advice from experience"
kind = "text"
content = """
RUNNING BETTER DUNGEONS
By DungeonMstr / The Digital Dungeon BBS

This isn't a rules document. It's advice that took me years to learn.

1. THE DUNGEON IS A LIVING PLACE

Players will do things you didn't predict. A dungeon where the monsters
just wait in their rooms for the party to show up is boring and
unrealistic. Establish patrol schedules. Have one group hear combat two
rooms away and come to investigate. Let a fleeing goblin alert the
chieftain. The dungeon should react.

But don't punish player creativity. If they think of something clever
that would actually work, let it work.

2. INFORMATION SHOULD BE HARD TO GET, NOT IMPOSSIBLE

The classic dungeon mistake: players walk into the Tomb of Horrors cold
and get killed by the first trap. That's not interesting. That's a
gotcha. Real traps in real castles were meant to be detected by the
WRONG people -- servants, invaders -- while the right people knew how
to avoid them.

Give players information. Rumor tables. Hireling knowledge. Old maps.
Let them do reconnaissance. The challenge is using what they find.

3. RANDOM TABLES ARE YOUR FRIEND, NOT YOUR CRUTCH

Roll for random encounters but don't just read the result straight.
"You encounter 2d6 goblins" becomes "you hear torch-light ahead and
the sound of something being dragged -- goblins, arguing in their
language about where to take the body."

The table generates the seed. You grow it into something real.

4. KNOW YOUR MONSTERS

A troll knows its own regeneration and will fight past the point a
human would flee -- it expects to heal. An intelligent undead will
recognize the party's cleric as the biggest threat and focus on them.
A dragon doesn't charge -- it assesses, retreats, attacks from height.

Monsters that fight smart are three times as dangerous as monsters
that have 50% more hit points.

5. THE PARTY IS NOT YOUR ENEMY

I've seen DMs who "win" by killing the party. That's not a game --
that's just rolling dice until the numbers come up bad enough.

The DM's job is to create a world that's dangerous and interesting.
The party's job is to navigate it. You want them to succeed at things
that are worth doing and fail at things that matter.

6. END SESSIONS AT THE RIGHT MOMENT

Never end mid-combat unless you have to. End at a decision point: they've
cleared the level and are deciding whether to descend. They've found a
clue and are debating what it means. They've made camp after a hard fight.

The ideal ending makes them want to come back next week.

-- DungeonMstr
"""
