[[sections.files]]
id = 2
name = "ADND_SPELLS.TXT"
size = "22K"
date = "02/14/93"
description = "AD&D 2nd Ed spell reference -- all schools"
kind = "text"
content = """
AD&D 2nd EDITION SPELL QUICK-REFERENCE
Compiled by DungeonMstr / The Digital Dungeon BBS

This covers the core PHB spells. Descriptions are abbreviated for
quick table lookup. Full text in your Player's Handbook.

========================================================================
WIZARD SPELLS -- LEVEL 1
========================================================================

BURNING HANDS (Evocation)
Range: 0  Duration: Instant  Area: 120-deg arc, 5' range
Damage: 1d3 per level (max 5d3), save for half.
Note: Targets must be in front of caster.

CHARM PERSON (Enchantment/Charm)
Range: 120'  Duration: Special  Saving Throw: Neg.
Target acts as if caster is a trusted friend. Check weekly.
Doesn't grant new languages; target won't take suicidal actions.

DETECT MAGIC (Divination)
Range: 0  Duration: 2 rounds/level  Area: 10' x 60' path
Detects magical auras. School identified on successful INT check.

MAGIC MISSILE (Evocation)
Range: 60'+10'/level  Duration: Instant  Area: 1 target/missile
1 missile at level 1, +1 per 2 levels (max 5). Each: 1d4+1, no save.
NEVER misses. Can split among targets.

SLEEP (Enchantment/Charm)
Range: 30'  Duration: 5 rounds/level  Area: 15' radius
Affects 2d4 HD of creatures (weakest first). No save.
Powerful at low levels, useless above 4 HD.

SHIELD (Abjuration)
Duration: 5 rounds/level  AC: 2 vs. missiles, 4 vs. others
Blocks magic missiles entirely. No encumbrance.

========================================================================
WIZARD SPELLS -- LEVEL 2
========================================================================

DARKNESS 15' RADIUS (Alteration)
Range: 10'/level  Duration: 1 turn + 1 round/level
Total darkness, negates infravision. Dispellable.

INVISIBILITY (Illusion/Phantasm)
Range: Touch  Duration: Special
Target invisible until they attack or cast. Doesn't silence.

KNOCK (Alteration)
Range: 60'  Duration: Special
Opens locked, barred, held, or wizard-locked doors. 1 door/cast.
Note: Makes audible knock sound. Doesn't work on portcullises.

MIRROR IMAGE (Illusion/Phantasm)
Duration: 3 rounds/level  Creates: 1d4 + 1/3 levels images
Each hit has equal chance to hit image or caster. Images vanish when hit.

WEB (Evocation)
Range: 5'/level  Duration: 2 turns/level  Area: 8,000 cubic feet
Creatures move 1/4 speed or are stuck. STR 13+ breaks free each round.
Flammable -- fire destroys web, deals 2d4 to trapped creatures.

========================================================================
CLERIC SPELLS -- LEVEL 1
========================================================================

BLESS (Conjuration/Summoning)
Range: 60'  Duration: 6 rounds  Area: 50' x 50'
+1 to attack rolls and saves vs. fear. Reverse: Curse.

COMMAND (Enchantment/Charm)
Range: 10'  Duration: 1 round  Saving Throw: Special
One-word command. Target obeys if fails save (penalty = Wis of caster).
Works on single creature, 1 HD min. "Die" = catatonia 1 round.

CURE LIGHT WOUNDS (Necromancy)
Range: Touch  Cures: 1d8 HP (max 8)
Note: Cannot exceed maximum HP. Reverse: Cause Light Wounds.

DETECT EVIL (Divination)
Range: 0  Duration: 1 round/level  Area: 10' x 120' path
Detects evil intent, auras, enchantments. Not alignment per se.

SANCTUARY (Abjuration)
Duration: 2 rounds + 1/level
Attackers must save vs. spell to target the cleric. Cleric can't attack.

========================================================================
CLERIC SPELLS -- LEVEL 2
========================================================================

AID (Necromancy/Conjuration)
Duration: 1 round/level
+1 to hit, +1 vs. death/fear, +1d8 HP (can exceed maximum temporarily).

HOLD PERSON (Enchantment/Charm)
Range: 120'  Duration: 2 rounds/level  Targets: 1-4 persons
Humanoids only (roughly). Save at -1 per additional target beyond first.

SILENCE 15' RADIUS (Alteration)
Range: 120'  Duration: 2 rounds/level
No sound in/from area. Centered on object or location.
Spellcasting requires verbal components -- this stops it cold.

SLOW POISON (Necromancy)
Range: Touch  Duration: 1 hour/level
Prevents death from poison for duration. Doesn't cure -- just delays.
Enough time to find Neutralize Poison or a temple.

========================================================================
NOTES FOR DMs
========================================================================

Common mistakes:
- Magic Missile always hits. Period. No "spell resistance" in 2nd Ed.
- Sleep doesn't affect undead, golems, or creatures over 4 HD.
- Knock is audible -- use this for realism.
- Bless requires a round of casting -- start it before combat.
- Hold Person is humanoids only. Define this for your campaign early.

-- DungeonMstr, The Digital Dungeon BBS
"""

