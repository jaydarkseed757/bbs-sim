[[sections.files]]
id = 8
name = "LOLLA93.TXT"
size = "8K"
date = "08/20/93"
description = "Lollapalooza 1993 tour dates and setlist notes"
kind = "text"
content = """
LOLLAPALOOZA 1993 -- TOUR RECAP
Compiled from multiple callers / FREQ 867 BBS

LINEUP (Main Stage):
  Primus
  Rage Against the Machine
  Alice in Chains (headliner)
  Arrested Development
  Dinosaur Jr.
  Babes in Toyland
  Fishbone

LINEUP (Second Stage):
  Tool
  Nine Inch Nails (before NIN exploded -- catch them here)
  Front 242

SETLIST NOTES (Chicago, from GigGoer's report):

Primus opened with 'Jerry Was a Race Car Driver' and 'Wynona's Big Brown Beaver.'
Les Claypool's bass playing stopped being normal music and became performance art.

RATM played an 8-song set that felt like being hit by a bus:
  Killing in the Name
  Wake Up
  Bullet in the Head
  Bombtrack
  Know Your Enemy
  Freedom
  (two more from the debut)

Tom Morello killed it. Zack de la Rocha was out of his mind. Crowd was insane.

Alice in Chains headlined. Layne Staley's voice in an open air amphitheater at night:
that is one of the finest moments in modern rock music. 'Would?' as the closer destroyed.

Nine Inch Nails second stage: Broken just came out. They played all of it plus
songs from Pretty Hate Machine. Trent Reznor is not entirely well and that's
100% what makes this work. Best second stage set of the tour by multiple accounts.

BOTTOM LINE:
If you didn't go this year, you missed one of the great festival lineups of the decade.
Tool, NIN, and RATM in one day for $25. This does not happen again.

-- FREQ 867 BBS
"""
