name = "SS7_NOTES.TXT"
size = "14K"
date = "03/28/93"
description = "SS7 signaling architecture -- technical deep dive"
kind = "text"
content = """
SS7 SIGNALING SYSTEM 7 -- TECHNICAL NOTES
By TelcoGhost / Midnight Rendezvous BBS

This is the architecture document I wish existed when I started.

OVERVIEW:

SS7 (Signaling System 7) is the protocol that controls phone calls
on the modern PSTN. It handles: call setup and teardown, number
translation, caller ID delivery, toll-free routing, and roaming for
mobile (though GSM/cellular specifics differ).

The key architectural decision: SS7 runs on a SEPARATE network from
the voice traffic it controls. This is Common Channel Signaling (CCS).
The old system (MF/in-band, what blue boxing exploited) put control
tones on the same audio channel as voice. SS7 uses packet-switched
links between switches.

THE COMPONENTS:

Service Switching Point (SSP)
  Your local central office switch. Originates and terminates calls.
  Sends query messages upstream for number translation, etc.

Signal Transfer Point (STP)
  A packet switch for SS7 messages. Routes signaling between SSPs
  and SCPs. Typically deployed in pairs for redundancy.

Service Control Point (SCP)
  A database node. Handles queries: "what does 800-555-0100 translate
  to?", "is this caller ID number valid?", "what roaming agreement
  applies here?"

CALL FLOW FOR A SIMPLE CALL:

1. You dial. Your local SSP recognizes a complete dialed number.
2. SSP sends IAM (Initial Address Message) toward destination SSP.
3. If routing requires database lookup (800 number, etc.), SSP queries
   SCP via STP. SCP returns routing info.
4. Destination SSP rings the line. Sends ACM (Address Complete Message)
   back to originating SSP.
5. Called party answers. Destination sends ANM (Answer Message).
6. Voice path is established. SS7 signaling is done for this call.
7. Either party hangs up. REL (Release) and RLC (Release Complete)
   messages clear the circuit.

CALLER ID AND ANI:

Caller ID (the display thing) is different from ANI (Automatic Number
Identification).

ANI is billing-grade -- the originating switch certifies the number.
Used for 800 calls to bill the recipient correctly. Hard to spoof
because the originating carrier is accountable.

Caller ID uses CPID (Calling Party ID) in the SS7 IAM. This is NOT
authenticated. The originating switch sends whatever it wants.
PBX systems and some specialized services can insert arbitrary numbers.
CNAM (the name display) is a separate SCP lookup done at the terminating
end -- it queries a LIDB (Line Information Data Base) with the number.

THE SECURITY PICTURE:

SS7 was designed in the 1970s-80s assuming only telcos had access to it.
Trust was implicit -- all SS7 nodes were expected to be operated by
telcos who had physical and logical access controls.

This assumption has always been imperfect (international interconnect
gives foreign carriers access to message routing) and is getting worse
as SS7 links are exposed through new carrier interconnect arrangements.

The attacks that are theoretically possible (location tracking via
MAP/HLR queries in GSM, call interception via routing manipulation)
are not something a random person can execute -- you need actual SS7
network access. But the number of entities with that access is growing.

RESOURCES:

Bellcore SR-TSV-002476 (SS7 overview, not classified, just hard to find)
CCITT Blue Book, Q.700 series (the actual protocol specs)
Telcordia (formerly Bellcore) technical references -- some via NTIS

-- TelcoGhost / Midnight Rendezvous BBS
"""

