description = "Hacker Crackdown -- Sterling excerpt & commentary"
kind = "text"
content = """
THE HACKER CRACKDOWN -- NOTES AND CONTEXT
By CyberLiberty / Midnight Rendezvous BBS

Bruce Sterling's _The Hacker Crackdown_ was published in 1992. Sterling
released it for free distribution -- he wanted it read.

WHY THIS BOOK MATTERS:

Sterling is a science fiction writer. He comes to the 1990 Operation
Sundevil raids without a technical background but with the ability to
talk to people on both sides and write about them as human beings.

The book has four parts:

Part 1: The history of telephone technology and the culture it created.
Part 2: The hacker community as Sterling found it in 1990.
Part 3: The law enforcement world -- the Secret Service, Gail Thackeray,
        the phone company security people.
Part 4: The legal aftermath -- the Jackson Games case, the founding
        of EFF, Phrack trial.

THE SUNDEVIL FRAMING:

Operation Sundevil was a multi-city Secret Service sweep in May 1990.
The stated target was credit card fraud and phone code trafficking.

The actual execution was broader. Systems were seized based on who used
them, not what they contained. The Secret Service operated under the
theory that hacker boards were organized criminal enterprises similar
to fencing operations.

This was wrong as a factual matter (most boards were not organized that
way) and counterproductive (it drove the community to encrypt and go
darker rather than operate openly).

THE LESSON ABOUT CULTURAL DISTANCE:

The most interesting part of the book is watching the cultural gap.
Hackers thought they were: curious, technically skilled, not hurting
anyone, doing something analogous to looking through windows.

Law enforcement thought they were: organized criminals, dangerous,
running a criminal infrastructure.

Both groups were partly right. Neither could talk to the other.

The EFF (Electronic Frontier Foundation) was founded specifically to
create a group that could speak both languages. Mitch Kapor (Lotus)
and John Perry Barlow (Grateful Dead lyricist, ranch owner, Compuserve
user who'd gotten the "manifesto") funded it.

WHERE TO GET IT:

It's on ftp.eff.org. Any decent FTP archive has it. Sterling wanted
it distributed.

-- CyberLiberty / Midnight Rendezvous BBS
"""

