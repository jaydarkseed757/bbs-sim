[package]
name = "bbs-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bbs-sim"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
thiserror = "1"
anyhow = "1"
